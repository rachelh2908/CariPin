<body> 
    <section id = "homepage">
        <img src = "/static/images/CariPin.png" alt = "CariPin Logo" style = "width: 300px; height: auto;">
        <p>Welcome to CariPin!</p> 
        <p style ="font-style: italic;" class="tagline">Pin what's happening.</p>
        <button id = "signup-button" style = "width: 200px; height: 50px;">Sign Up</button>
        <p class="setupconditionnote"> Quick one-time setup</p>   
    </section> 
    
<section id = "signup" hidden> 
    <h2 id ="signuptitle">Sign Up</h2>
    <form id = "signup-form">
        <label for = "firstname">First Name</label>
        <input id = "firstname" name="firstname" required>
        
        <label for = "lastname">Last Name</label>
        <input id = "lastname" name="lastname" required>

        <label for = "username">Username</label>
        <input id = "username" name="username" required>

        <label for = "dateofbirth">Date of Birth</label>
        <input id = "dateofbirth" name="dateofbirth" type="date" min="1900-01-01" max="" required>

        <label for="age">Age</label>
        <input id = "age" name="age" type="number" readonly required> 

        <label for = "gender">Gender</label>
        <select id = "gender" name="gender" required onchange="document.getElementById('othergender').style.display = this.value === 'Other' ? 'block' : 'none'">
            <option value = "">Select your gender</option>
            <option value = "Male">Male</option>
            <option value = "Female">Female</option>
            <option value = "Other">Other</option>
        </select>
        <input type = "text" id="othergender" name="othergender" placeholder="Please specify your gender" style="display:none;">

        <label for = "approximateheight">Approximate Height (cm)</label>
        <input id ="approximateheight" name="approximateheight" type="number" min="1" required>
        
        <label for = "approximateweight">Approximate Weight (kg)</label>
        <input id = "approximateweight" name="approximateweight" type="number" min="1" required>

        <label for = "country">Country</label>
        <select id = "country" name = "country" required> 
            <option value = "">Select a country</option>
            <option value = "Jamaica">Jamaica</option>
            <option value = "Montserrat">Montserrat</option>
            <option value = "Grenada">Grenada</option>
        </select>

    <div id = "parishContainer" style = "display:none;"> 
        <label for= "parish">Parish</label>
        <select id = "parish" name = "parish"></select>
    </div>

    <button type = "submit" id="signup-submit">Sign Up</button>
    </form>
</section>

<section id="app" hidden>
    <div id="topbar">
         <button type="button" id="menu-button">☰ Menu</button>
        <span id="userprofile"></span>
    </div>

    <nav id="sidebar" hidden>
        <button type="button" id="backbutton">Back</button>
        <button type ="button" data-view="view-map">Pin It</button>
        <button type="button" data-view="view-directory">Emergency Services</button>
        <button type="button" data-view="view-card">My Safety Card</button>
        <button type="button" id="edit-info">Edit My Information</button>
        <button type="button" id="reset">Reset my Information</button>
    </nav>

    <div id="view-directory" class="view" hidden>
        <h2>Emergency Services</h2>
        <p id="directory-place"></p>
        <div id="directory-list"></div>
    </div>

    <div id="view-card" class="view" hidden>
        <h2>My Safety Card</h2>
        <div class="card">
            <p><strong id="card-name"></strong></p>
            <p>Username: <span id="card-username"></span></p>
            <p>Age: <span id="card-age"></span> | DOB: <span id="card-dob"></span></p>
            <p>Gender: <span id="card-gender"></span></p>
            <p>Height: <span id="card-height"></span> cm | Weight: <span id="card-weight"></span> kg</p>
            <p>Location: <span id="card-location"></span></p>
        </div>
    </div>
    <div id="view-edit" class="view" hidden> 
        <h2>Edit My Information</h2>
        <form id="edit-form"> 
        
            <label for="edit-firstname">First Name </label>
            <input id="edit-firstname" readonly> 
        
            <label for="edit-lastname">Last Name</label>
            <input id="edit-lastname" readonly> 
    
            <label for="edit-username">Username</label>
            <input id="edit-username" readonly> 

            <label for="edit-dob">Date of Birth</label>
            <input id="edit-dob" readonly> 

            <label for="edit-age">Age</label>
            <input id="edit-age" readonly>

            <label for="edit-gender">Gender</label>
            <select id="edit-gender" disabled> 
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <input id="edit-othergender" readonly style="display:none;">

            <label for="edit-height">Height</label>
            <input id="edit-height" readonly> 

            <label for="edit-weight">Weight</label>
            <input id="edit-weight" readonly> 

            <label for="edit-country">Country</label>
            <select id= "edit-country" required> 
                <option value="Jamaica">Jamaica</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Grenada">Grenada</option>
            </select>

            <label for="edit-parish">Parish</label>
            <select id="edit-parish" required></select>      
            
            <button type="submit">Save Changes</button>
        </form>
    </div>
<div id="view-map" class="view" hidden> 
    <h2>Pin It</h2>
    <p id="map-place" ></p>
    <div class="map-controls"> 
        <select id="hazard-type"></select>
        <input id="hazard-note"  placeholder="Short note (optional)" maxlength="100">
    </div>
    <button type="button" id="placepin-button">📍Add a pin </button>
    <div id="map"></div>

    <h3>Nearest help</h3>
    <p id="nearby-note"></p>
    <div id="nearby-list"></div>
</div>
</section>
<footer> 
        2026-Team CariPin
    </footer>

           ageInput.value = dobInput.value ? calculateAge(dobInput.value):"";

        const dob = new Date(dobString); 
        const now = new Date();
        let age = now.getFullYear() - dob.getFullYear();
        const hadBirthday = 
            now.getMonth() > dob.getMonth() ||
            (now.getMonth() === dob.getMonth() && now.getDate() >= dob.getDate());

            age --;

function phoneLink(phoneText, codedial) {
    const digits = phoneText.replace(/\D/g, "");
    const a = document.createElement("a");
    let dial; 
    if (digits.length<=4) dial = digits; 
    else if (digits.length ===7) dial = codedial+digits; 
    else if (digits.length === 10) dial = "+1"+ digits; 
    else dial = "+" + digits; 
    a.href ="tel:" + dial;
    a.textContent = phoneText.replace(/\s/g,""); 
    return a;
}

function addGroup(box, title, items, codedial) {
    if (!items || items.length === 0) return;

    const h = document.createElement("h3");
    h.textContent = title;
    box.appendChild(h);

    items.forEach(item => {
        const card = document.createElement("div");
        card.className = "service";

        const name = document.createElement("strong");
        name.textContent = item.name;
        card.appendChild(name);

        const loc = document.createElement("div");
        loc.textContent = (item.location || "").trim();
        card.appendChild(loc);

        (item.phones || []).forEach(p => {
            const line = document.createElement("div");
            line.appendChild(phoneLink(p, codedial));
            card.appendChild(line);
        });

        if (item.ambulance) {
            const line = document.createElement("div");
            line.append("Ambulance: ");
            line.appendChild(phoneLink(item.ambulance, codedial));
            card.appendChild(line);
        }

        if (item.note) {
            const line = document.createElement("div");
            line.textContent = item.note;
            card.appendChild(line);
        }

        box.appendChild(card);
    });
}

function collectServices(countryName) {
    const data = directory[countryName];
    const out = [];
    if (!data) return out;
    Object.values(data.Parishes || {}).forEach(parishData => {
        Object.keys(serviceTypes).forEach(type => {
            (parishData[type] || []).forEach(item => {
                const lat = Number(item.lat ?? item.Lat);
                const lng = Number(item.lng ?? item.Lng);
                if (!isNaN(lat) && !isNaN(lng)) {
                    out.push({ ...item, lat, lng, type: type, codedial: data.codedial });
                }
            });
        });
    });
    return out;
}

function distanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
}

// straight-line distance x 1.4 for winding roads, at an assumed 35 km/h average
function minutesAway(km) {
    return Math.max(1, Math.round((km * 1.4 / 35) * 60));
}
function selectPin(pin) { 
    const h = hazards[pin.type]; 
    const label = h.emoji + " " + h.label + (pin.note ? " ("+ pin.note +")" :"");
    renderNearby({lat:pin.lat, lng: pin.lng, label: label}); 
}

function showHelpPrompt() { 
    serviceLayer.clearLayers(); 
    document.getElementById("nearby-list").innerHTML=""; 
    document.getElementById("nearby-note").textContent = "Tap a pin on the map to see the nearest help from it.";
}
function renderNearby(spot) {
    serviceLayer.clearLayers();
    const box = document.getElementById("nearby-list");
    const noteEl = document.getElementById("nearby-note");
    box.innerHTML = "";

    const all = collectServices(mapCountry).map(s => ({
        ...s, km: distanceKm(spot.lat, spot.lng, s.lat, s.lng)
    }));

    if (all.length === 0) {
        noteEl.textContent = "No services with map locations listed yet for this country.";
        return;
    }
    noteEl.textContent = "Measured from: " + spot.label + ". Times are approximate.";

    L.circleMarker([spot.lat, spot.lng], { radius: 18, color: "#065958", weight: 3, fillOpacity: 0, interactive: false })
        .addTo(serviceLayer);

    all.forEach(s => {
        const icon = L.divIcon({
            html: '<div class="pin">' + serviceTypes[s.type].emoji + '</div>',
            className: "", iconSize: [30, 30], iconAnchor: [15, 15]
        });
        const popup = document.createElement("div");
        const nm = document.createElement("strong");
        nm.textContent = s.name;
        popup.appendChild(nm);
        (s.phones || []).forEach(p => {
            const line = document.createElement("div");
            line.appendChild(phoneLink(p, s.codedial));
            popup.appendChild(line);
        });
        L.marker([s.lat, s.lng], { icon }).bindPopup(popup).addTo(serviceLayer);
    });

    Object.keys(serviceTypes).forEach(type => {
        const nearest = all.filter(s => s.type === type).sort((a, b) => a.km - b.km).slice(0, 2);
        if (nearest.length === 0) return;

        const h = document.createElement("h3");
        h.textContent = serviceTypes[type].emoji + " " + serviceTypes[type].label;
        box.appendChild(h);

        nearest.forEach(s => {
            const card = document.createElement("div");
            card.className = "service";

            const nm = document.createElement("strong");
            nm.textContent = s.name;
            card.appendChild(nm);

            const eta = document.createElement("div");
            eta.textContent = "≈ " + minutesAway(s.km) + " min away (" + s.km.toFixed(1) + " km straight line)";
            card.appendChild(eta);

            (s.phones || []).forEach(p => {
                const line = document.createElement("div");
                line.appendChild(phoneLink(p, s.codedial));
                card.appendChild(line);
            });
            box.appendChild(card);
        });
    });
}

// ---------- map ----------
function buildMap(countryName) {
    if (map) { map.remove(); }
    mapCountry = countryName;
    const bounds = countryBounds[countryName];

    map = L.map("map", { maxBounds: bounds, maxBoundsViscosity: 1.0 });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    map.fitBounds(bounds);
    map.setMinZoom(map.getZoom());   // can't zoom out past the country

    pinLayer = L.layerGroup().addTo(map);
    serviceLayer = L.layerGroup().addTo(map);

    map.on("click", async (e) => {
    if (!placing) return;
    const body = {
        country: mapCountry,
        type: hazardSelect.value,
        note: document.getElementById("hazard-note").value.trim(),
        lat: e.latlng.lat,
        lng: e.latlng.lng
    };
    setPlacing(false);
    try {
        const res = await fetch("/api/pins", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("save failed");
        const saved = await res.json();
        localStorage.setItem("caripinMine", JSON.stringify(myPinIds().concat(saved.id)));
        await renderPins();
        selectPin({ ...body, id: saved.id });
        document.getElementById("hazard-note").value = "";
        } catch (err) {
        alert("Could not save your pin. Check your connection and try again.");
    }
});

    renderPins();
}
function openMap() {
    if (!currentUser) return;
    document.getElementById("map-place").textContent = currentUser.country;
    if (!map || mapCountry !== currentUser.country) buildMap(currentUser.country);
    else { map.invalidateSize(); renderPins(); }
    setPlacing(false);
    
    const mine = (samplePins[mapCountry] || {})[currentUser.parish] || [];
    const first = mine[0]
    if (first) {
        selectPin(first);
        map.setView([first.lat, first.lng], 12);
    } else {
        showHelpPrompt();
    }
}
document.getElementById("placepin-button").addEventListener("click", () => setPlacing(!placing));
const saved = localStorage.getItem("caripinUser");
if (saved) {
    showApp(JSON.parse(saved));
} else if (sessionStorage.getItem("goToSignup")) {
    sessionStorage.removeItem("goToSignup");
    homepage.hidden = true;
    signup.hidden = false;
}
setInterval(() => {
    if (map && !document.getElementById("view-map").hidden) renderPins();
}, 60000);
    </script>
